    else{bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}
  }else{bom=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);}
  releaseBOM(ln.line,wh,bom,ln.color,ln.size,ln.colorBreakdown);
}
function releaseBOM(line,wh,bom,color,size,colorBreakdown){
  bom.forEach(function(b){
    if(b.isDoor){
      var doorColors=colorBreakdown&&colorBreakdown.length>0?colorBreakdown:[{color:color,qty:b.qty}];
      doorColors.forEach(function(dc){
        if(isOrderColor(line,dc.color)||dc.color==='open')return;
        var dk=b.key;
        if(HELD[line][wh][dk]&&HELD[line][wh][dk][dc.color]){
          HELD[line][wh][dk][dc.color][size]=Math.max(0,(HELD[line][wh][dk][dc.color][size]||0)-dc.qty);
        }
      });
    }else if(b.sub!==undefined){
      /* v14 Codex P1対応: 鍵類はjp2バケットから戻す */
      var relLine=normalizeStockLine(line,b.key);
      if(HELD[relLine]&&HELD[relLine][wh]&&HELD[relLine][wh][b.key]){
        HELD[relLine][wh][b.key][b.sub]=Math.max(0,(HELD[relLine][wh][b.key][b.sub]||0)-b.qty);
      }
    }else{
      var relLine2=normalizeStockLine(line,b.key);
      if(HELD[relLine2]&&HELD[relLine2][wh]){
        HELD[relLine2][wh][b.key]=Math.max(0,(HELD[relLine2][wh][b.key]||0)-b.qty);
      }
    }
  });
}

function holdBOMMulti(line,whA,whB,bom,color,size,colorBreakdown){
  /* v14.2 Codex P2対応: 倉庫別actualHeld を返す（出荷BOM Excel の倉庫分配ロジックで使用） */
  var actualHeld=[];
  bom.forEach(function(b){
    if(b.isDoor){
      var doorColors=colorBreakdown&&colorBreakdown.length>0?colorBreakdown:[{color:color,qty:b.qty}];
      doorColors.forEach(function(dc){
        if(isOrderColor(line,dc.color)||dc.color==='open')return;
        var dk=b.key;
        var freeA=availD(line,whA,dc.color,size,dk);
        var takeA=Math.min(freeA,dc.qty),takeB=dc.qty-takeA;
        if(takeA>0){
          if(!HELD[line][whA][dk])HELD[line][whA][dk]={};
          if(!HELD[line][whA][dk][dc.color])HELD[line][whA][dk][dc.color]={};
          HELD[line][whA][dk][dc.color][size]=(HELD[line][whA][dk][dc.color][size]||0)+takeA;
          actualHeld.push({isDoor:true,key:dk,color:dc.color,size:size,qty:takeA,heldLine:line,_wh:whA});
        }
        if(takeB>0){
          if(!HELD[line][whB][dk])HELD[line][whB][dk]={};
          if(!HELD[line][whB][dk][dc.color])HELD[line][whB][dk][dc.color]={};
          HELD[line][whB][dk][dc.color][size]=(HELD[line][whB][dk][dc.color][size]||0)+takeB;
          actualHeld.push({isDoor:true,key:dk,color:dc.color,size:size,qty:takeB,heldLine:line,_wh:whB});
        }
      });
    }else if(b.sub!==undefined){
      /* v14 Codex P1: 鍵類はjp2バケット */
      var hl=normalizeStockLine(line,b.key);
      if(!HELD[hl])HELD[hl]={};
      if(!HELD[hl][whA])HELD[hl][whA]={door:{},doorH:{}};
      if(!HELD[hl][whB])HELD[hl][whB]={door:{},doorH:{}};
      var fA=avail(hl,whA,b.key,b.sub);
      var tA=Math.min(fA,b.qty),tB=b.qty-tA;
      if(tA>0){
        if(!HELD[hl][whA][b.key])HELD[hl][whA][b.key]={};HELD[hl][whA][b.key][b.sub]=(HELD[hl][whA][b.key][b.sub]||0)+tA;
        actualHeld.push({isDoor:false,key:b.key,sub:b.sub,qty:tA,heldLine:hl,_wh:whA});
      }
      if(tB>0){
        if(!HELD[hl][whB][b.key])HELD[hl][whB][b.key]={};HELD[hl][whB][b.key][b.sub]=(HELD[hl][whB][b.key][b.sub]||0)+tB;
        actualHeld.push({isDoor:false,key:b.key,sub:b.sub,qty:tB,heldLine:hl,_wh:whB});
      }
    }else{
      var hl2=normalizeStockLine(line,b.key);
      if(!HELD[hl2])HELD[hl2]={};
      if(!HELD[hl2][whA])HELD[hl2][whA]={door:{},doorH:{}};
      if(!HELD[hl2][whB])HELD[hl2][whB]={door:{},doorH:{}};
      var fA2=avail(hl2,whA,b.key);
      var tA2=Math.min(fA2,b.qty),tB2=b.qty-tA2;
      if(tA2>0){HELD[hl2][whA][b.key]=(HELD[hl2][whA][b.key]||0)+tA2;actualHeld.push({isDoor:false,key:b.key,qty:tA2,heldLine:hl2,_wh:whA});}
      if(tB2>0){HELD[hl2][whB][b.key]=(HELD[hl2][whB][b.key]||0)+tB2;actualHeld.push({isDoor:false,key:b.key,qty:tB2,heldLine:hl2,_wh:whB});}
    }
  });
  return actualHeld;
}

/* v18.30 要望③: 部材別倉庫指定の仮押さえを whA/whB へ正しく出荷消費するため、
   _actualHeld の _wh 記録から「その倉庫で押さえた数量」を合算して返す。
   _wh 未記録(旧データ/自動分配)は0を返し、従来どおり whA優先の貪欲分配になる（完全後方互換）。 */
function _heldQtyAt(ln,wh,b,dcColor){
  var src=ln._actualHeld||[];var s=0;
  src.forEach(function(e){
    if(e._wh!==wh)return;
    if(b.isDoor){if(e.isDoor&&e.key===b.key&&e.color===dcColor)s+=e.qty;}
    else if(b.sub!==undefined){if(!e.isDoor&&e.key===b.key&&e.sub===b.sub)s+=e.qty;}
    else{if(!e.isDoor&&e.key===b.key&&e.sub===undefined)s+=e.qty;}
  });
  return s;
}
function shipOrderMulti(order){
  /* v14.2 Codex P1/P2対応: 部分解放履歴を BOM から差し引く（扉は色別、ラインIDで突合） */
  var pr=order._partialReleases||[];
  var prSub={},prDoor={};
  pr.forEach(function(r){
    var ln_=r.line||'_';
    if(r.isDoor){var k=ln_+'|'+r.key+'|'+(r.color||'')+'|'+(r.doorSub||'');prDoor[k]=(prDoor[k]||0)+r.released;}
    else{var k2=ln_+'|'+r.key+'|'+(r.sub||'');prSub[k2]=(prSub[k2]||0)+r.released;}
  });
  var whA=order.wh,whB=order.wh2;
  order.lines.forEach(function(ln){
    if(ln.isFreeInput)return;
    /* v14.3 Codex P2対応: 出荷後の出荷Excel BOM 表示用に _actualHeld を別フィールドに保存 */
    if(ln._actualHeld&&ln._actualHeld.length>0){
      ln._shippedActualHeld=ln._actualHeld.map(function(ah){return Object.assign({},ah);});
    }
    var bom;
    if(ln.isPartOnly){
      bom=[];
      if(ln.isDoor){bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel,isDoor:true,doorSub:ln.partSub});}
      else if(ln.partSub!==undefined){bom.push({key:ln.partKey,sub:ln.partSub,qty:ln.qty,label:ln.partLabel});}
      else{bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}
    }else{bom=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);}
    /* 部分解放分を BOM から差し引く（非扉部材） - ラインIDキー */
    bom.forEach(function(b){
      if(b.isDoor)return;/* 扉は後段で色別に処理 */
      if(b.sub!==undefined){
        var pk2=ln.line+'|'+b.key+'|'+(b.sub||'');
        if(prSub[pk2]>0){var d2=Math.min(b.qty,prSub[pk2]);b.qty-=d2;prSub[pk2]-=d2;}
        else if(prSub[pk2]<0){b.qty+=(-prSub[pk2]);prSub[pk2]=0;}/* v14.5 C1: 数量編集の増量分を出荷BOMに加算 */
      }else{
        var pk3=ln.line+'|'+b.key+'|';
        if(prSub[pk3]>0){var d3=Math.min(b.qty,prSub[pk3]);b.qty-=d3;prSub[pk3]-=d3;}
        else if(prSub[pk3]<0){b.qty+=(-prSub[pk3]);prSub[pk3]=0;}/* v14.5 C1: 増量分を加算 */
      }
    });
    bom=bom.filter(function(b){return b.isDoor||b.qty>0;});
    var orderCol=isOrderColor(ln.line,ln.color);
    bom.forEach(function(b){
      if(b.isDoor){
        /* 扉: colorBreakdown を コピーし、色別に部分解放を反映 */
        var origBd=ln.colorBreakdown&&ln.colorBreakdown.length>0?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];
        var doorColors2=origBd.map(function(c){return{color:c.color,qty:c.qty};});
        doorColors2.forEach(function(dc){
          var pk=ln.line+'|'+b.key+'|'+(dc.color||'')+'|'+(b.doorSub||ln.size||'');
          if(prDoor[pk]>0){var dd=Math.min(dc.qty,prDoor[pk]);dc.qty-=dd;prDoor[pk]-=dd;}
          else if(prDoor[pk]<0){dc.qty+=(-prDoor[pk]);prDoor[pk]=0;}/* v14.5 C1: 扉の増量分を加算 */
        });
        doorColors2.forEach(function(dc){
          if(dc.qty<=0)return;
          if(isOrderColor(ln.line,dc.color)||dc.color==='open')return;
          var dk=b.key;
          var sA=(STK[ln.line]&&STK[ln.line][whA]&&STK[ln.line][whA][dk]&&STK[ln.line][whA][dk][dc.color]&&STK[ln.line][whA][dk][dc.color][ln.size])||0;
          /* v18.30 要望③: 部材別倉庫指定があれば押さえた倉庫から消費（未指定は従来のwhA優先） */
          var desA=_heldQtyAt(ln,whA,b,dc.color),desB=_heldQtyAt(ln,whB,b,dc.color);
          var wantA=(desA||desB)?Math.min(dc.qty,Math.max(desA,dc.qty-desB)):dc.qty;
          var takeA=Math.min(sA,wantA),takeB=dc.qty-takeA;
          if(takeA>0){
            var nVA=Math.max(0,sA-takeA);
            STK[ln.line][whA][dk][dc.color][ln.size]=nVA;
            EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:ln.line,key:dk,sub:ln.size,color:dc.color,wh:whA,oldVal:sA,newVal:nVA,label:'扉('+dc.color+' '+ln.size+')出荷消費 '+order.no,editor:'出荷処理'});
          }
          if(takeB>0&&STK[ln.line]&&STK[ln.line][whB]&&STK[ln.line][whB][dk]&&STK[ln.line][whB][dk][dc.color]){
            var sB0=STK[ln.line][whB][dk][dc.color][ln.size]||0;
            var nVB=Math.max(0,sB0-takeB);
            STK[ln.line][whB][dk][dc.color][ln.size]=nVB;
            EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:ln.line,key:dk,sub:ln.size,color:dc.color,wh:whB,oldVal:sB0,newVal:nVB,label:'扉('+dc.color+' '+ln.size+')出荷消費 '+order.no,editor:'出荷処理'});
          }

      }else if(b.sub!==undefined){
        /* v14 Codex P1: 鍵類はjp2バケットから消費 */
        var sl=normalizeStockLine(ln.line,b.key);
        var sA2=(STK[sl]&&STK[sl][whA]&&STK[sl][whA][b.key]&&STK[sl][whA][b.key][b.sub])||0;
        var desA2=_heldQtyAt(ln,whA,b),desB2=_heldQtyAt(ln,whB,b);
        var wantA2=(desA2||desB2)?Math.min(b.qty,Math.max(desA2,b.qty-desB2)):b.qty;
        var tA2=Math.min(sA2,wantA2),tB2=b.qty-tA2;
        if(tA2>0){
          var nVA2=Math.max(0,sA2-tA2);
          STK[sl][whA][b.key][b.sub]=nVA2;
          EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:sl,key:b.key,sub:b.sub,wh:whA,oldVal:sA2,newVal:nVA2,label:(b.label||b.key)+'出荷消費 '+order.no,editor:'出荷処理'});
        }
        if(tB2>0&&STK[sl]&&STK[sl][whB]&&STK[sl][whB][b.key]){
          var sB1=STK[sl][whB][b.key][b.sub]||0;
          var nVB1=Math.max(0,sB1-tB2);
          STK[sl][whB][b.key][b.sub]=nVB1;
          EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:sl,key:b.key,sub:b.sub,wh:whB,oldVal:sB1,newVal:nVB1,label:(b.label||b.key)+'出荷消費 '+order.no,editor:'出荷処理'});
        }
      }else{
        var sl2=normalizeStockLine(ln.line,b.key);
        var sA3=(STK[sl2]&&STK[sl2][whA]&&STK[sl2][whA][b.key])||0;
        var desA3=_heldQtyAt(ln,whA,b),desB3=_heldQtyAt(ln,whB,b);
        var wantA3=(desA3||desB3)?Math.min(b.qty,Math.max(desA3,b.qty-desB3)):b.qty;
        var tA3=Math.min(sA3,wantA3),tB3=b.qty-tA3;
        if(tA3>0){
          var nVA3=Math.max(0,sA3-tA3);
          STK[sl2][whA][b.key]=nVA3;
          EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:sl2,key:b.key,wh:whA,oldVal:sA3,newVal:nVA3,label:(b.label||b.key)+'出荷消費 '+order.no,editor:'出荷処理'});
        }
        if(tB3>0&&STK[sl2]&&STK[sl2][whB]){
          var sB2=STK[sl2][whB][b.key]||0;
          var nVB2=Math.max(0,sB2-tB3);
          STK[sl2][whB][b.key]=nVB2;
          EDIT_LOG.push({timestamp:new Date().toLocaleString('ja-JP'),lineId:sl2,key:b.key,wh:whB,oldVal:sB2,newVal:nVB2,label:(b.label||b.key)+'出荷消費 '+order.no,editor:'出荷処理'});
        }
      }
    });
    /* v14.3 Codex P2対応: 他案件のHELDを巻き込まないよう、本案件の _actualHeld を介して解放
       releaseLine は _wh ごとに正確に該当HELDを引くため、shipOrderMulti でも安全 */
    releaseLine(ln,whA);
    releaseLine(ln,whB);
  });
}

      if(b.isDoor)return;/* 扉は後段で色別に処理 */
      if(b.sub!==undefined){
        var pk2=ln.line+'|'+b.key+'|'+(b.sub||'');
        if(prSub[pk2]>0){var d2=Math.min(b.qty,prSub[pk2]);b.qty-=d2;prSub[pk2]-=d2;}
        else if(prSub[pk2]<0){b.qty+=(-prSub[pk2]);prSub[pk2]=0;}/* v14.5 C1: 数量編集の増量分を出荷BOMに加算 */
      }else{
        var pk3=ln.line+'|'+b.key+'|';

      }
    });

    var orderCol=isOrderColor(ln.line,ln.color);
    bom.forEach(function(b){

        var origBd=ln.colorBreakdown&&ln.colorBreakdown.length>0?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];

/* ========== CHECK ALL LINES AT WAREHOUSE ========== */
function checkAllLinesWH(lines,wh){
  var allOk=true,allItems=[];
  /* Group lines by product line (jp01, jp2, tw, sa) since they use separate inventory pools */
  var byLine={};
  lines.forEach(function(ln){
    if(!byLine[ln.line])byLine[ln.line]=[];
    byLine[ln.line].push(ln);
  });
  Object.keys(byLine).forEach(function(lineId){
    var group=byLine[lineId];
    /* Check if this product line exists at the warehouse */
    if(!hasStock(lineId,wh)){
      allOk=false;
      allItems.push({label:'製品ライン「'+(LINES.find(function(l){return l.id===lineId;})||{}).name+'」取扱なし',need:0,stock:0,held:0,free:0,ok:false,shortage:0});
      return;
    }
    /* Aggregate BOM quantities across all order lines in this product line group */
    var structAgg={};/* key: "key|sub" -> {qty, label, key, sub} */
    var doorAgg={};/* key: "doorKey|color|size" -> {qty, label, doorKey, color, size} */
    var simpleAgg={};/* key: "key" -> {qty, label, key} */
    group.forEach(function(ln){
      if(ln.isFreeInput)return;/* Free input lines have no inventory to check */
      var bom;
      if(ln.isPartOnly){
        bom=[];
        if(ln.isDoor){bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel,isDoor:true,doorSub:ln.partSub});}
        else if(ln.partSub!==undefined){bom.push({key:ln.partKey,sub:ln.partSub,qty:ln.qty,label:ln.partLabel});}
        else{bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}
      }else{bom=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);}
      var orderCol=isOrderColor(lineId,ln.color);
      var colorName_=(LINE_COLORS[lineId]||[]).find(function(cc){return cc.v===ln.color;});
      var cLabel=colorName_?(' '+colorName_.l):'';
      bom.forEach(function(b){
        if(b.isDoor){
          /* E7: multi-color support */
          var doorColors=ln.colorBreakdown&&ln.colorBreakdown.length>0?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];
          doorColors.forEach(function(dc){
            if(dc.color==='open')return;/* オープン(扉なし)は扉在庫を消費しない */
            var oc2=isOrderColor(lineId,dc.color);
            var cn2=(LINE_COLORS[lineId]||[]).find(function(cc){return cc.v===dc.color;});
            var cl2=cn2?(' '+cn2.l):'';
            if(oc2){
              var oKey='order|'+b.key+'|'+dc.color+'|'+ln.size;
              if(!doorAgg[oKey])doorAgg[oKey]={qty:0,label:b.label+cl2,doorKey:b.key,color:dc.color,size:ln.size,isOrder:true};
              doorAgg[oKey].qty+=dc.qty;
            }else{
              var dKey=b.key+'|'+dc.color+'|'+ln.size;
              if(!doorAgg[dKey])doorAgg[dKey]={qty:0,label:b.label+cl2,doorKey:b.key,color:dc.color,size:ln.size,isOrder:false};
              doorAgg[dKey].qty+=dc.qty;
            }
          });
        }else if(b.sub!==undefined){
          var sKey=b.key+'|'+b.sub;
          if(!structAgg[sKey])structAgg[sKey]={qty:0,label:b.label,key:b.key,sub:b.sub};
          structAgg[sKey].qty+=b.qty;
        }else{
          if(!simpleAgg[b.key])simpleAgg[b.key]={qty:0,label:b.label,key:b.key};
          simpleAgg[b.key].qty+=b.qty;
        }
      });
    });
    /* Check aggregated structural parts */
    Object.keys(structAgg).forEach(function(k){
      var a=structAgg[k];
      var stock=gs(lineId,wh,a.key,a.sub);
      var held=gh(lineId,wh,a.key,a.sub);
      var free=stock-held;
      var pass=free>=a.qty;
      if(!pass)allOk=false;
      allItems.push({label:a.label,need:a.qty,stock:stock,held:held,free:free,ok:pass,shortage:Math.max(0,a.qty-free)});
    });
    /* Check aggregated doors */
    Object.keys(doorAgg).forEach(function(k){
      var a=doorAgg[k];
      if(a.isOrder){
        /* v18.31: 扉色未定(und)は受発注インフラに乗せつつ表示だけ「色未定」に分ける
           v18.47 修正４⑤追: 受発注色の扉（アイボリー・グレー・ブラック）も実在庫を持つことがあるのに
           一律0で積んでいたため、部材内訳に「受発注」としか出ず在庫数が分からなかった。
           実際の在庫数・仮押さえ数・空きを引いて渡す（受発注扱いのため ok:true / shortage:0 は従来どおり維持し、
           在庫が足りなくても案件全体をNGにしない）。
           扉色未定(und)は在庫行そのものが存在しないため従来どおり0のまま。 */
        var isUndA=isUndColor(a.color);
        var stockA=isUndA?0:gd(lineId,wh,a.color,a.size,a.doorKey);
        var heldA=isUndA?0:ghd(lineId,wh,a.color,a.size,a.doorKey);
        allItems.push({label:a.label,need:a.qty,stock:stockA,held:heldA,free:stockA-heldA,ok:true,orderItem:true,und:isUndA,shortage:0});
        return;
      }
      var stock=gd(lineId,wh,a.color,a.size,a.doorKey);
      var held=ghd(lineId,wh,a.color,a.size,a.doorKey);
      var free=stock-held;
      var pass=free>=a.qty;
      if(!pass)allOk=false;
      allItems.push({label:a.label,need:a.qty,stock:stock,held:held,free:free,ok:pass,shortage:Math.max(0,a.qty-free)});
    });
    /* Check aggregated simple parts */
    Object.keys(simpleAgg).forEach(function(k){
      var a=simpleAgg[k];
      /* v14 Codex P2対応: 共通在庫キーはここでスキップ、後で全ライン合算で集約チェック */
      if(isCommonStockKey(a.key)){
        if(!allItems._commonAgg)allItems._commonAgg={};
        if(!allItems._commonAgg[a.key])allItems._commonAgg[a.key]={qty:0,label:a.label,key:a.key};
        allItems._commonAgg[a.key].qty+=a.qty;
        return;
      }
      var stock=gs(lineId,wh,a.key);
      var held=gh(lineId,wh,a.key);
      var free=stock-held;
      var pass=free>=a.qty;
      if(!pass)allOk=false;
      allItems.push({label:a.label,need:a.qty,stock:stock,held:held,free:free,ok:pass,shortage:Math.max(0,a.qty-free)});
    });
  });
  /* v14 Codex P2対応: 共通在庫キーの全ライン合算チェック（鍵類は全製品ラインで共有プール） */
  if(allItems._commonAgg){
    Object.keys(allItems._commonAgg).forEach(function(k){
      var a=allItems._commonAgg[k];
      /* v18.44 修正３⑥ / v18.45 追: 受注発注部材は在庫不足でも案件全体をNGにしない。
         在庫が足りていれば通常どおり在庫数表示（在庫を押さえる運用）、不足時のみ受発注バッジ */
      if(isOrderOnlyKey(a.key)){
        var stockO=gs('jp2',wh,a.key);
        var heldO=gh('jp2',wh,a.key);
        var freeO=stockO-heldO;
        allItems.push({label:a.label,need:a.qty,stock:stockO,held:heldO,free:freeO,ok:true,orderItem:freeO<a.qty,shortage:0});
        return;
      }
      /* gs(jp2,wh,key) は鍵類で全ライン合算プール値を返す */
      var stock=gs('jp2',wh,a.key);
      var held=gh('jp2',wh,a.key);
      var free=stock-held;
      var pass=free>=a.qty;
      if(!pass)allOk=false;
      /* v18.33 追A: ユーザー向け表示から「共通プール」表記を削除（全ライン合算の仕組みは不変） */
      allItems.push({label:a.label,need:a.qty,stock:stock,held:held,free:free,ok:pass,shortage:Math.max(0,a.qty-free)});
    });
    delete allItems._commonAgg;
  }
  return{ok:allOk,items:allItems};
}

   従来は 'D'+(CUSTS.length+1) で採番していたため、顧客や案件を削除して件数が減ると

   「クリックした行と違う行」に効き、画面上は消えていないように見える二次症状も起きていた。
   → 既存IDの最大採番＋1から、実際に未使用のIDになるまで進めて返す。 */
function nextCustId(){
  var mx=0,used={};
  CUSTS.forEach(function(c){
    var cid=String(c&&c.id||'');
    used[cid]=true;
    var m=/^D(\d+)$/.exec(cid);
    if(m){var n=parseInt(m[1],10);if(!isNaN(n)&&n>mx)mx=n;}
  });
  var n2=mx+1,id='D'+String(n2).padStart(5,'0');
  while(used[id]){n2++;id='D'+String(n2).padStart(5,'0');}
  return id;
}

}

/* v18.24 要望6: 初期アカウントを3つ(管理者/営業/事務)に。本番のパスワードはクラウド(lec_state.users)で管理。
   ここはクラウド未取得時のフォールバック定義(PWなし)。実運用のPWは管理者がユーザー管理から設定/変更する。 */
var USERS=[

/* v18 P2: 簡易パスワードハッシュ（クライアント側のソフトアクセス制御。強固な暗号ではない点に留意）。
   USERS[].pw に hashPw(平文) を保存。pw 未設定ユーザーは従来通りパスワード無しでログイン可（ロックアウト防止）。
   role: admin(管理者・全権) / user(事務・編集可) / sales(営業・閲覧+見積確認のみ=書込不可) */
function hashPw(s){var h=5381;s=String(s||'');for(var i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))&0xffffffff;}return 'h'+(h>>>0).toString(36);}
function findUserByName(nm){return USERS.find(function(u){return u.name===nm;});}
function roleOf(nm){var u=findUserByName(nm);return u?(u.role||'user'):(nm?'user':'');}
/* v18.32 要望⑨: ログイン検証の純関数化。未登録氏名はログイン不可（従来は任意氏名がノーチェックで通過）。
   パスワード設定済ユーザーは照合必須。PW未設定の登録済ユーザーは従来どおり空欄で通過
   （初期フォールバック3アカウントのロックアウト防止。完全必須化は全ユーザーへのPW設定後に可能）。 */
function validateLogin(nm,pw,users){
  nm=String(nm||'').trim();
  if(!nm)return {ok:false,reason:'empty'};
  var u=(users||USERS).find(function(x){return x.name===nm;});
  if(!u)return {ok:false,reason:'unregistered'};
  if(u.pw&&hashPw(pw||'')!==u.pw)return {ok:false,reason:'badpw'};
  return {ok:true,user:u};
}

function lockEditorName(users){try{var pk=(typeof SYSTEM_LOCK!=='undefined'&&SYSTEM_LOCK)?SYSTEM_LOCK.primary:null;if(!pk||!Array.isArray(users))return '';var e=users.find(function(u){return u.presenceKey===pk;});return e?e.name:'';}catch(_){return '';}}

/* v14 D32: システム全体ロック判定（先勝ち） */
var SYSTEM_LOCK={primary:null,/* presenceKey of primary user */ acquiredAt:null, overrideName:null/* v18.17 要望5: 管理者が指定した編集権限ユーザー名(null=先勝ち自動) */};
/* v18.17 要望5: 編集権限保持者(primary)を決定。overrideName指定時はその名のユーザー(最古参加)を優先、無ければ先勝ち(最古参加)。純粋関数=vm検証可。 */
/* v18.49 修正６⑩: 営業(role='sales')はそもそも書込不可（roleReadOnly）なので、編集権限の順番待ちに入れない。
   従来は入った順だけで決めていたため「営業・営業・事務」の順にログインすると、
   営業2人が抜けるまで事務が編集できなかった。営業を候補から外し、事務・管理者だけで順番が回るようにする。 */
function canHoldEditRight(name){return roleOf(name)!=='sales';}
function resolveEditor(allKeys,users,overrideName,myKey,currentPrimary){
  var sorted=(allKeys||[]).slice().sort(function(a,b){return (a.joinedAt||0)-(b.joinedAt||0);});
  /* v18.49 修正６⑩: presenceKey → 名前 の対応から営業ロールを除外した「編集権限を持てる人」だけの一覧を作る */
  var nameByKey={};
  (users||[]).forEach(function(u){if(u&&u.presenceKey)nameByKey[u.presenceKey]=u.name;});
  var eligible=sorted.filter(function(k){
    var nm=nameByKey[k.key];
    /* 名前が取れない（presence情報が欠けている）場合は従来どおり候補に残す＝誰も編集できない事故を防ぐ */
    return nm===undefined?true:canHoldEditRight(nm);
  });
  var eligibleKeys=eligible.map(function(k){return k.key;});
  var primaryKey=null;
  /* 1) 管理者が手動で編集者を指定(override)した場合のみ最優先（自動ではなく明示操作） */
  if(overrideName){
    var cand=(users||[]).filter(function(u){return u.name===overrideName;}).sort(function(a,b){return (a.joinedAt||0)-(b.joinedAt||0);});
    if(cand.length)primaryKey=cand[0].presenceKey;
  }
  /* 2) v18.25 要望⑤: 入った順(先勝ち)を最優先で維持。現在の編集者がオンラインのままなら、
     後から参加した人（最高権限の吉野さんのログイン含む）に編集権限を自動で奪われない（操作途中の保護）。
     v18.49 修正６⑩: 判定は「編集権限を持てる人」の中でのオンライン判定に変更。 */
  if(!primaryKey&&currentPrimary&&eligibleKeys.indexOf(currentPrimary)>=0)primaryKey=currentPrimary;
  /* 3) 現在の編集者が居ない（離脱）時のみ、最古参加=先頭が新しい編集者になる。 */
  if(!primaryKey)primaryKey=eligible.length?eligible[0].key:null;
  return {primaryKey:primaryKey,amIPrimary:!!(primaryKey&&primaryKey===myKey)};
}

function yagiCodeFor(key,sub,color){
  if(key==='door'||key==='doorH'){var s3=(sub==='3S')?'3S':sub;return KEY_TO_YAGI[key+'|'+s3+'|'+(color||'')]||null;}
  var k=KEY_TO_YAGI[key+'|'+(sub||'')];
  return k||KEY_TO_YAGI[key+'|']||null;
}
/* 鍵類・付属（=粗利区分「鍵類」）の判定: 共通プールキー＋錠前系 */
function isLockCostKey(key){return COMMON_STOCK_KEYS.indexOf(key)>=0||/^dial|^cylinder|^padlock|^totte|^searchKey|^masterKey|^coinReturn/.test(key);}
/* 案件→粗利区分別の売価・原価集計。原価はBOM数量×COST_MASTER[品番]。品番or原価が無い部材は missing にカウント */
function calcGrossProfit(order){
  var cat={body:{sell:0,cost:0,missing:0},lock:{sell:0,cost:0,missing:0},base:{sell:0,cost:0,missing:0},shelf:{sell:0,cost:0,missing:0}};
  (order.lines||[]).forEach(function(l){
    if(l.isFreeInput){cat.body.sell+=l.qty*(l.unitPrice||0);return;}
    if(l.isPartOnly){
      var c=(l.partKey==='base'||l.partKey==='base_bk')?'base':(l.partKey==='shelf'||l.partKey==='shelf_bk')?'shelf':(isLockCostKey(l.partKey)?'lock':'body');
      cat[c].sell+=l.qty*(l.unitPrice||0);return;
    }
    var so=sizeObj(l.size);
    cat.body.sell+=l.qty*so.p;
    var sq=parseInt(l.shelfQty)||0;if(sq>0)cat.shelf.sell+=sq*SHELF_PRICE;
  });
  var baseLines=(order.lines||[]).filter(function(l){return !l.isPartOnly&&!l.isFreeInput&&l.hasBase!==false;});
  cat.base.sell+=baseLines.reduce(function(s,l){return s+lineBaseCount(l);},0)*4000;
  var agg=aggregateOrderBOM(order);
  Object.keys(agg).forEach(function(kk){
    var pp=kk.split('|');var key=pp[0],sub=pp[1],color=pp[2];var qty=agg[kk];if(!(qty>0))return;
    var c=(key==='base'||key==='base_bk')?'base':(key==='shelf'||key==='shelf_bk')?'shelf':(isLockCostKey(key)?'lock':'body');
    var code=yagiCodeFor(key,sub,color);
    var cost=code!=null?COST_MASTER[code]:null;
    if(cost==null){cat[c].missing+=1;return;}
    cat[c].cost+=qty*cost;
  });
  var total={sell:0,cost:0,missing:0};
  ['body','lock','base','shelf'].forEach(function(c){total.sell+=cat[c].sell;total.cost+=cat[c].cost;total.missing+=cat[c].missing;});
  return {body:cat.body,lock:cat.lock,base:cat.base,shelf:cat.shelf,total:total,hasCost:Object.keys(COST_MASTER).length>0};
}
/* 原価表アップロード: 「品番,原価」列を含むCSV/Excel（1シート目）。ヘッダ行の「品番」「原価」を検出、無ければ 1列目=品番/最終数値列=原価 */
function parseCostMasterAoa(aoa){
  var res={},cnt=0;
  var hdr=-1,ci={code:-1,cost:-1};
  for(var r=0;r<Math.min(aoa.length,10);r++){
    var row=aoa[r]||[];
    row.forEach(function(x,i){var s=String(x||'');if(/品番|商品コード/.test(s)&&ci.code<0)ci.code=i;if(/原価|仕入|単価/.test(s)&&ci.cost<0)ci.cost=i;});
    if(ci.code>=0&&ci.cost>=0){hdr=r;break;}
  }
  for(var rr=(hdr>=0?hdr+1:0);rr<aoa.length;rr++){
    var rw=aoa[rr]||[];if(!rw.length)continue;
    var code,cost;
    if(hdr>=0){code=String(rw[ci.code]||'').trim();cost=parseFloat(rw[ci.cost]);}
    else{
      code=String(rw[0]||'').trim();cost=NaN;
      for(var c2=rw.length-1;c2>=1;c2--){var v=parseFloat(rw[c2]);if(!isNaN(v)){cost=v;break;}}
    }
    if(!code||isNaN(cost))continue;
    res[code]=cost;cnt++;
  }
  return {map:res,count:cnt};
}

  }
  /* v18.37 修正箇所2: 商品備考は廃止（明細各行の備考欄へ移行） */
  wsData.push([]);
  if(docType==='invoice'){

    wsData.push(['振込先: 商工組合中央金庫 上野支店 普通 1300806 カ)レック']);
  }
  /* v18.37 修正箇所2⑦: 見積書下部の 支払条件・有効期限・振込先 は削除 */
  /* v18.37 修正箇所2⑥: 全体備考は改行ごとに1行として出力（入力内容と連動） */
  if(order.notes){wsData.push([]);wsData.push(['備考']);String(order.notes).split('\n').forEach(function(t){wsData.push(['',t]);});}

  ws['!cols']=[{wch:14},{wch:42},{wch:8},{wch:8},{wch:12},{wch:14},{wch:8},{wch:20}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:7}}];
  XLSX.utils.book_append_sheet(wb,ws,cfg.sheet);
  /* v14.2 Codex P2対応: 出荷指示書には BOM/部材一覧シートを追加（倉庫作業者向け） */
  if(docType==='shipping'){
    var bomData=[['【出荷指示書 — 部材一覧】 案件: '+order.no+' / 出力日: '+td2()],[],['製品ライン','部材','サイズ/色','数量','倉庫','備考']];
    /* v14.2 Codex P2対応: 出荷Excel BOMでも _partialReleases のラインID で突合 */
    var prSubE={},prDoorE={};
    (order._partialReleases||[]).forEach(function(r){
      var ln_=r.line||'_';
      if(r.isDoor){var kk=ln_+'|'+r.key+'|'+(r.color||'')+'|'+(r.doorSub||'');prDoorE[kk]=(prDoorE[kk]||0)+r.released;}
      else{var k2=ln_+'|'+r.key+'|'+(r.sub||'');prSubE[k2]=(prSubE[k2]||0)+r.released;}
    });
    /* v14.2 Codex P2対応: マルチ倉庫(order.wh2)の場合は _actualHeld の _heldWh から正しい倉庫を引く */
    order.lines.forEach(function(ln){
      if(ln.isFreeInput){bomData.push(['',ln.name||'[自由入力]','',ln.qty,WH_MAP[order.wh]?WH_MAP[order.wh].n:order.wh,ln.unit||'個']);return;}
      var lnObj=LINES.find(function(l){return l.id===ln.line;});
      var lineName=lnObj?lnObj.name:'';
      var lineWh=ln._heldWh||order.wh;/* このラインが押さえた倉庫 */
      var bomLn;
      if(ln.isPartOnly){
        bomLn=[];
        if(ln.isDoor){bomLn.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel,isDoor:true,doorSub:ln.partSub,color:ln.color});}
        else if(ln.partSub!==undefined){bomLn.push({key:ln.partKey,sub:ln.partSub,qty:ln.qty,label:ln.partLabel});}
        else{bomLn.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}
      }else{bomLn=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);}
      /* v14.2 Codex P2対応: 扉は colorBreakdown を展開して色別に行を分割 */
      var expanded=[];
      bomLn.forEach(function(b){
        if(b.isDoor){
          var origBd=ln.colorBreakdown&&ln.colorBreakdown.length>0?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];
          origBd.forEach(function(dc){
            if(dc.qty<=0)return;
            expanded.push({key:b.key,qty:dc.qty,label:b.label,isDoor:true,doorSub:b.doorSub||ln.size,color:dc.color,reason:b.reason||''});
          });
        }else{
          expanded.push({key:b.key,sub:b.sub,qty:b.qty,label:b.label,isDoor:false,reason:b.reason||''});
        }
      });
      expanded.forEach(function(b){
        /* 部分解放分を差し引いて表示（ラインIDで突合） */
        var releasedNote='';
        if(b.isDoor){
          var pk=ln.line+'|'+b.key+'|'+(b.color||'')+'|'+(b.doorSub||'');
          if(prDoorE[pk]>0){var d=Math.min(b.qty,prDoorE[pk]);b.qty-=d;prDoorE[pk]-=d;releasedNote=' (部分解放 -'+d+')';}
          else if(prDoorE[pk]<0){b.qty+=(-prDoorE[pk]);releasedNote=' (数量編集 +'+(-prDoorE[pk])+')';prDoorE[pk]=0;}
        }else if(b.sub!==undefined){
          var pk2=ln.line+'|'+b.key+'|'+(b.sub||'');
          if(prSubE[pk2]>0){var dd=Math.min(b.qty,prSubE[pk2]);b.qty-=dd;prSubE[pk2]-=dd;releasedNote=' (部分解放 -'+dd+')';}
          else if(prSubE[pk2]<0){b.qty+=(-prSubE[pk2]);releasedNote=' (数量編集 +'+(-prSubE[pk2])+')';prSubE[pk2]=0;}
        }else{
          var pk3=ln.line+'|'+b.key+'|';
          if(prSubE[pk3]>0){var ddd=Math.min(b.qty,prSubE[pk3]);b.qty-=ddd;prSubE[pk3]-=ddd;releasedNote=' (部分解放 -'+ddd+')';}
          else if(prSubE[pk3]<0){b.qty+=(-prSubE[pk3]);releasedNote=' (数量編集 +'+(-prSubE[pk3])+')';prSubE[pk3]=0;}
        }
        if(b.qty<=0)return;
        var lbl=b.label||partLabelJP(b.key,b.sub,b.isDoor?b.color:null,b.isDoor);
        var sub=b.isDoor?(b.doorSub||''):(b.sub||'');
        /* v14.2/14.3 Codex P2対応: マルチ倉庫案件は ln._actualHeld（本案件のみ）から倉庫別分配を引く
           グローバルHELDを使うと他案件の押さえ分まで含まれて誤分配するため
           出荷後は _shippedActualHeld（出荷前のスナップショット）をフォールバックとして使う */
        if(order.wh2){
          var whA=order.wh,whB=order.wh2;
          var heldA=0,heldB=0;
          var heldSrc=(ln._actualHeld&&ln._actualHeld.length>0)?ln._actualHeld:(ln._shippedActualHeld||[]);
          heldSrc.forEach(function(ah){
            if(ah.key!==b.key)return;
            if(b.isDoor){if(!ah.isDoor||ah.color!==b.color||ah.size!==b.doorSub)return;}
            else if(b.sub!==undefined){if(ah.sub!==b.sub)return;}
            var wOf=ah._wh||ln._heldWh||whA;/* actualHeldにwh記録がない場合は ln._heldWh をフォールバック */
            if(wOf===whA)heldA+=ah.qty;
            else if(wOf===whB)heldB+=ah.qty;
          });
          var totalH=heldA+heldB;
          if(totalH>0){
            var qA=Math.round(b.qty*(heldA/totalH));
            var qB=b.qty-qA;
            if(qA>0)bomData.push([lineName,lbl,sub,qA,WH_MAP[whA]?WH_MAP[whA].n:whA,(b.reason||'')+releasedNote]);
            if(qB>0)bomData.push([lineName,lbl,sub,qB,WH_MAP[whB]?WH_MAP[whB].n:whB,(b.reason||'')+releasedNote]);
            return;
          }
          /* _actualHeld が記録されていない場合は両倉庫を併記してwarehouseに「+ 倉庫B」と注記 */
          bomData.push([lineName,lbl,sub,b.qty,(WH_MAP[whA]?WH_MAP[whA].n:whA)+' + '+(WH_MAP[whB]?WH_MAP[whB].n:whB),(b.reason||'')+releasedNote+' (倉庫分配未記録)']);
          return;
        }
        bomData.push([lineName,lbl,sub,b.qty,WH_MAP[lineWh]?WH_MAP[lineWh].n:lineWh,(b.reason||'')+releasedNote]);
      });
    });
    var wsBom=XLSX.utils.aoa_to_sheet(bomData);
    wsBom['!cols']=[{wch:14},{wch:36},{wch:10},{wch:10},{wch:14},{wch:24}];
    XLSX.utils.book_append_sheet(wb,wsBom,'部材一覧(BOM)');
    /* v18.25 要望③: 公式様式(出荷指示書テンプレ完全一致)を同一ブックの3枚目として統合し、1ファイルで一括ダウンロード。
       v18.29 顧客要望: 印刷レイアウトも正本と一致（工場様式シートに 印刷範囲/縮小率/余白/実列幅 を付与）。 */
    var shipPerSheet=null;
    try{
      var shipTpl=buildShipInstruction(order);
      if(shipTpl&&shipTpl.ws){
        var fIdx=wb.SheetNames.length;/* この後 append する工場様式シートの0始まりインデックス */
        XLSX.utils.book_append_sheet(wb,shipTpl.ws,shipTpl.sheetName||'出荷指示書(様式)');
        var fName=wb.SheetNames[fIdx];/* SheetJSが確定した実シート名 */
        if(shipTpl.print&&fName){
          wb.Workbook=wb.Workbook||{};wb.Workbook.Names=wb.Workbook.Names||[];
          wb.Workbook.Names.push({Name:'_xlnm.Print_Area',Ref:"'"+fName+"'!"+shipTpl.print.area,Sheet:fIdx});
          shipPerSheet=[];shipPerSheet[fIdx]={scale:shipTpl.print.scale,center:shipTpl.print.center,cols:shipTpl.print.cols};
        }
      }
    }catch(eShip){console.warn('様式統合に失敗',eShip);}
    if(shipPerSheet){writeXlsxWithPrint(wb,cfg.sheet+'_'+order.no+'.xlsx',shipPerSheet);return;}
  }
  XLSX.writeFile(wb,cfg.sheet+'_'+order.no+'.xlsx');
}

/* ========== REALTIME BROADCAST HELPER ========== */
function broadcastEdit(userName,detail){
  cloudSave(userName);/* v14.6: クラウド永続保存(オフラインでもREST可なら保存) */
  if(!broadcastChannel)return;
  try{
    var payload={user:userName,detail:detail,time:new Date().toLocaleTimeString('ja-JP'),stk:STK,editLog:EDIT_LOG.slice(-50)};
    var sz=JSON.stringify(payload).length;
    if(sz>240000){/* ペイロード大: STKを送らず通知のみ */
      broadcastChannel.send({type:'broadcast',event:'inventory_edit',payload:{user:userName,detail:detail+'（要リロード）',time:payload.time,heavy:true}});
    }else{
      broadcastChannel.send({type:'broadcast',event:'inventory_edit',payload:payload});
    }
  }catch(e){console.warn('broadcastEdit failed',e);}
}
/* v14.4: 案件管理のリアルタイム同期通知（ペイロードサイズチェック + STK は明示的に必要時のみ送信）
   ORDERS と HELD は仮押さえ即時反映のため必ず送信、STK は出荷処理時のみ更新するため別フラグ */
function broadcastOrderUpdate(userName,detail,opts){
  cloudSave(userName);/* v14.6: クラウド永続保存(テーブル未作成/オフライン時は no-op) */
  if(!broadcastChannel)return;
  opts=opts||{};
  try{
    var payload={
      user:userName,detail:detail,time:new Date().toLocaleTimeString('ja-JP'),
      orders:ORDERS,nextON:nextON,held:HELD
    };
    /* 出荷処理など STK が変わる操作のみ STK を同梱 */
    if(opts.includeStk!==false)payload.stk=STK;
    var sz=JSON.stringify(payload).length;
    if(sz>240000){
      /* ペイロードが大きすぎる場合は STK を切って再送、それでも超える場合は ORDERS の最新10件のみ送る */
      delete payload.stk;
      var sz2=JSON.stringify(payload).length;
      if(sz2>240000){
        var recent=ORDERS.slice(-10);
        /* v14.5: 仮押さえ(HELD)は通常STKより小さいため heavy 時も同梱して使える数のズレを防ぐ。ただし合算で超過する場合は held を落とす */
        var hPayload={user:userName,detail:detail+'（一部のみ同期/要リロード）',time:payload.time,orders:recent,nextON:nextON,held:HELD,heavy:true};
        if(JSON.stringify(hPayload).length>240000)delete hPayload.held;
        broadcastChannel.send({type:'broadcast',event:'order_update',payload:hPayload});
      }else{
        broadcastChannel.send({type:'broadcast',event:'order_update',payload:payload});
      }
    }else{
      broadcastChannel.send({type:'broadcast',event:'order_update',payload:payload});
    }
  }catch(e){console.warn('broadcastOrderUpdate failed',e);}
}
/* v14.5: HELD のディープマージ（初期同期用）。葉(数値)は src で上書き、src に無いローカルキーは保持。
   絶対値カウントなので「セルごとに src 値を採用＋ローカル限定セルを残す」で二重計上を防ぐ */
function mergeHeldDeep(tgt,src){
  if(src===null||typeof src!=='object')return src;
  if(typeof tgt!=='object'||tgt===null)tgt={};
  Object.keys(src).forEach(function(k){
    if(typeof src[k]==='object'&&src[k]!==null){tgt[k]=mergeHeldDeep(tgt[k],src[k]);}
    else{tgt[k]=src[k];}
  });
  return tgt;
}
/* v14.5 E1: ポップアップを安全に開く。ブロック時は false を返し、呼び出し側の在庫保存等を妨げない */
function openPrintWindow(html){
  var w;
  try{w=window.open('','_blank','width=800,height=1000');}catch(e){w=null;}
  if(!w)return false;
  try{w.document.write(html);w.document.close();setTimeout(function(){try{w.print();}catch(e){}},500);}catch(e){return false;}
  return true;
}

/* ========== v18.33 追B: 顧客CSV取込（Access出力16列） ========== */
/* 列: 顧客コード,顧客名称,顧客フリガナ,顧客敬称,担当者名称,担当者名称フリガナ,担当者敬称,郵便番号,住所1,住所2,電話番号,FAX番号,携帯電話番号,Email1,Email2,備考
   住所1から都道府県を分離して既存構造(pref/city)へマッピング。顧客コードでupsert（既存は属性(attr)・弊社担当を保持）。 */
function parseCsvText(txt){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt[i];
    if(q){
      if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function splitPrefAddr(a1,a2){
  var s=String(a1||'').trim();
  var m=s.match(/^(北海道|東京都|京都府|大阪府|..県|...県)/);
  var pref=m?m[1]:'';
  var city=(m?s.slice(m[1].length):s)+String(a2||'').trim();
  return {pref:pref||'東京都',city:city};
}
function importCustsAoa(aoa){
  var hdr=-1,ci={};
  var COLS={id:/顧客コード/,name:/顧客名称/,kana:/顧客フリガナ/,tantou:/^担当者名称$/,postal:/郵便番号/,a1:/住所1/,a2:/住所2/,phone:/電話番号/,fax:/FAX番号/,mobile:/携帯電話番号/,e1:/Email1/i,e2:/Email2/i,note:/備考/};
  for(var r=0;r<Math.min(aoa.length,5);r++){
    var row=aoa[r]||[];var found={};
    row.forEach(function(x,i){var s=String(x||'');Object.keys(COLS).forEach(function(k){if(COLS[k].test(s)&&found[k]==null)found[k]=i;});});
    if(found.id!=null&&found.name!=null){hdr=r;ci=found;break;}
  }
  if(hdr<0)return {added:0,updated:0,skipped:0,error:'ヘッダ行（顧客コード・顧客名称）を認識できません'};
  var added=0,updated=0,skipped=0;
  for(var rr=hdr+1;rr<aoa.length;rr++){
    var rw=aoa[rr]||[];
    var id=String(rw[ci.id]||'').trim(),name=String(rw[ci.name]||'').trim();
    if(!id||!name){skipped++;continue;}
    var pa=splitPrefAddr(ci.a1!=null?rw[ci.a1]:'',ci.a2!=null?rw[ci.a2]:'');
    var rec={id:id,name:name,pref:pa.pref,city:pa.city,
      postal:String((ci.postal!=null?rw[ci.postal]:'')||'').trim(),
      phone:String((ci.phone!=null?rw[ci.phone]:'')||'').trim(),
      fax:String((ci.fax!=null?rw[ci.fax]:'')||'').trim(),
      contactPerson:String((ci.tantou!=null?rw[ci.tantou]:'')||'').trim(),
      kana:String((ci.kana!=null?rw[ci.kana]:'')||'').trim(),
      mobile:String((ci.mobile!=null?rw[ci.mobile]:'')||'').trim(),
      email:String((ci.e1!=null?rw[ci.e1]:'')||'').trim(),
      note:String((ci.note!=null?rw[ci.note]:'')||'').trim()};
    var ex=CUSTS.find(function(c){return c.id===id;});
    if(ex){Object.assign(ex,rec);updated++;}/* attr(顧客属性)・salesPersonはrecに無いため保持される */
    else{rec.contact='';rec.salesPerson='';rec.attr='';CUSTS.unshift(rec);added++;}
  }
  return {added:added,updated:updated,skipped:skipped};
}

  function doCheck(ls){
    if(!ls||!ls.length){whResults[1]([]);multiWH[1]([]);return;}
    var results=[];

      var anyLine=ls.some(function(l){return hasStock(l.line,wId);});
      if(!anyLine){results.push({whId:wId,whName:WH_MAP[wId].n,check:{ok:false,items:[{label:'取扱製品なし',need:0,stock:0,held:0,free:0,ok:false,shortage:0}]},noLine:true});return;}
      var check=checkAllLinesWH(ls,wId);
      var ship=cust?calcShipping(ls,wId,shipPref()):null;
      results.push({whId:wId,whName:WH_MAP[wId].n,check:check,ship:ship});
    });
    /* Sort: OK first, then v01 priority (deplete old stock), then by shipping cost */
    var hasV01=ls.some(function(l){return l.line==='jp01';});
    results.sort(function(a,b){
      if(a.check.ok&&!b.check.ok)return -1;if(!a.check.ok&&b.check.ok)return 1;
      /* If order includes jp01 lines, prioritize warehouses that have jp01 stock */
      if(hasV01&&a.check.ok&&b.check.ok){

        if(aHasV01&&!bHasV01)return -1;if(!aHasV01&&bHasV01)return 1;

        if(ln.isFreeInput)return;/* Free input lines have no inventory to check */
        if(!bomByLine[ln.line])bomByLine[ln.line]=[];
        var bom;
        if(ln.isPartOnly){

          else if(ln.partSub!==undefined){bom.push({key:ln.partKey,sub:ln.partSub,qty:ln.qty,label:ln.partLabel});}
          else{bom.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}
        }else{bom=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);}
        bom.forEach(function(b){

        });
      });

      var aggBOM=[];/* Array of {lineId, key, sub, color, size, doorKey, isDoor, isOrder, qty, label} */
      Object.keys(bomByLine).forEach(function(lineId){
        var structAgg={},doorAgg={},simpleAgg={};
        bomByLine[lineId].forEach(function(item){
          var b=item.b;
          if(b.isDoor){
            if(item.orderCol){return;/* Skip order colors */}
            var dKey=b.key+'|'+item.color+'|'+item.size;
            if(!doorAgg[dKey])doorAgg[dKey]={qty:0,label:b.label,doorKey:b.key,color:item.color,size:item.size};
            doorAgg[dKey].qty+=b.qty;
          }else if(b.sub!==undefined){
            var sKey=b.key+'|'+b.sub;
            if(!structAgg[sKey])structAgg[sKey]={qty:0,label:b.label,key:b.key,sub:b.sub};
            structAgg[sKey].qty+=b.qty;
          }else{
            if(!simpleAgg[b.key])simpleAgg[b.key]={qty:0,label:b.label,key:b.key};
            simpleAgg[b.key].qty+=b.qty;

        Object.keys(structAgg).forEach(function(k){var a=structAgg[k];aggBOM.push({lineId:lineId,key:a.key,sub:a.sub,isDoor:false,qty:a.qty,label:a.label});});
        Object.keys(doorAgg).forEach(function(k){var a=doorAgg[k];aggBOM.push({lineId:lineId,doorKey:a.doorKey,color:a.color,size:a.size,isDoor:true,qty:a.qty,label:a.label});});
        Object.keys(simpleAgg).forEach(function(k){var a=simpleAgg[k];aggBOM.push({lineId:lineId,key:a.key,isDoor:false,qty:a.qty,label:a.label});});

          /* v18.44 修正３⑤: 複数倉庫押さえの主倉庫は新柏。組合せに新柏が含まれる場合は
             whA(先に在庫を押さえる側)を新柏に固定し、不足分をもう一方の倉庫から押さえる

            if(!ab.isDoor&&ab.key&&isOrderOnlyKey(ab.key)){

              if(hasStock(ab.lineId,wB)){sOB=gs(ab.lineId,wB,ab.key);hOB=gh(ab.lineId,wB,ab.key);}
              var fOA=sOA-hOA,fOB=sOB-hOB;

              if(hasStock(ab.lineId,wB)){stockB=gd(ab.lineId,wB,ab.color,ab.size,ab.doorKey);heldB=ghd(ab.lineId,wB,ab.color,ab.size,ab.doorKey);}
            }else if(ab.sub!==undefined){

              if(hasStock(ab.lineId,wB)){stockB=gs(ab.lineId,wB,ab.key,ab.sub);heldB=gh(ab.lineId,wB,ab.key,ab.sub);}
            }else{
              if(hasStock(ab.lineId,wA)){stockA=gs(ab.lineId,wA,ab.key);heldA=gh(ab.lineId,wA,ab.key);}
              if(hasStock(ab.lineId,wB)){stockB=gs(ab.lineId,wB,ab.key);heldB=gh(ab.lineId,wB,ab.key);}

          });

            var shipB=cust?calcShipping(ls,wB,shipPref()):null;

  function getBOM(ln){
    if(ln.isFreeInput)return[];/* Free input lines have no BOM */
    if(ln.isPartOnly){var b=[];if(ln.isDoor){b.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel,isDoor:true,doorSub:ln.partSub});}else if(ln.partSub!==undefined){b.push({key:ln.partKey,sub:ln.partSub,qty:ln.qty,label:ln.partLabel});}else{b.push({key:ln.partKey,qty:ln.qty,label:ln.partLabel});}return b;}

  function doHoldAndQuote(){

  function doHoldAndQuoteMulti(){

  /* v18.30 要望③: 部材別に倉庫を指定して仮押さえ（例: 本体=新柏、鍵=本社）。
     _actualHeld の各エントリに _wh を記録するため、解除(releaseLine)・出荷(shipOrderMulti)・差戻し(reHoldFromSnapshot)・
     出荷Excelの倉庫分配は既存ロジックのまま正しく動く（幽霊在庫を作らない）。倉庫は order.wh/wh2 の2つまで。 */
  function partFreeAt(ln,b,w){
    try{
      if(b.isDoor){
        var colors=ln.colorBreakdown&&ln.colorBreakdown.length?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];
        var mn=Infinity;
        colors.forEach(function(dc){if(isOrderColor(ln.line,dc.color)||dc.color==='open')return;var f=availD(ln.line,w,dc.color,ln.size,b.key);if(f<mn)mn=f;});
        return mn===Infinity?0:Math.max(0,mn);
      }
      var hl=normalizeStockLine(ln.line,b.key);
      return Math.max(0,b.sub!==undefined?avail(hl,w,b.key,b.sub):avail(hl,w,b.key));
    }catch(e){return 0;}
  }
  function openPartWh(){

    var init={};
    var def=selWH[0]||(whResults[0].find(function(r){return r.check&&r.check.ok&&!r.noLine;})||{}).whId||WH_IDS[0];
    lines[0].forEach(function(ln,li){
      if(ln.isFreeInput)return;
      getBOM(ln).forEach(function(b,bi){init[li+'_'+bi]=def;});
    });
    partWhSel[1](init);showPartWh[1](true);
  }
  function doHoldAndQuoteAssigned(){
    if(!lines[0].length)return;
    if(p.isReadOnly){p.toast('読み取り専用モード中は仮押さえできません');return;}
    var sel=partWhSel[0]||{};
    var used={};Object.keys(sel).forEach(function(k){if(sel[k])used[sel[k]]=(used[sel[k]]||0)+1;});
    var whList=Object.keys(used);
    if(!whList.length){p.toast('倉庫を選択してください');return;}
    if(whList.length>2){p.toast('倉庫は2つまでにしてください（現在'+whList.length+'倉庫）');return;}
    whList.sort(function(a,b){return used[b]-used[a];});
    /* v18.44 修正３⑤: 部材別倉庫指定でも、新柏が含まれる場合は主倉庫(order.wh)を新柏にする */
    var kIx=whList.indexOf('kashiwa');
    if(kIx>0){whList.splice(kIx,1);whList.unshift('kashiwa');}
    var main=whList[0],second=whList[1]||null;
    /* 空き不足の事前確認（不足分は未確保=発注待ちで登録） */
    var shortMsg=[];
    lines[0].forEach(function(ln,li){
      if(ln.isFreeInput)return;
      getBOM(ln).forEach(function(b,bi){
        var w=sel[li+'_'+bi]||main;
        var free=partFreeAt(ln,b,w);
        /* v18.31: 扉は受発注色/扉色未定/オープン分を需要から除外して比較（仮押さえ対象外のため不足警告に含めない。従来はund/bk等で常に不足誤警告→実際は未確保登録もされず文言が事実と不一致だった） */

    var clonedLines=lines[0].map(function(l){return Object.assign({},l);});
    var unsecuredParts=[];
    clonedLines.forEach(function(ln,li){
      if(ln.isFreeInput)return;
      var bom=getBOM(ln);
      var merged=[];
      bom.forEach(function(b,bi){
        var wh=sel[li+'_'+bi]||main;
        var got=holdBOMPartial(ln.line,wh,[b],ln.color,ln.size,ln.colorBreakdown,unsecuredParts);
        got.forEach(function(e2){e2._wh=wh;});

    var shipB=(second&&cust)?calcShipping(clonedLines,second,shipPref()):null;
    var totalShip=(shipA?shipA.shipping:0)+(second&&shipB?shipB.shipping:0);
    var no=takeOrderNo('QT');/* v18.46 修正５⑤: 修正モード中は元の案件番号へ上書き */
    var ptA=paymentTerms[0]==='その他'?paymentCustom[0]:paymentTerms[0];
    var order={no:no,cid:cust.id,wh:main,status:'仮押さえ',date:td2(),lines:clonedLines,shipping:totalShip,discount:parseInt(discount[0])||0,createdBy:p.userName||'',shipMethod:shipMethod[0]||'',shipDest:shipDest[0]||'cust',subject:quoteSubject[0]||'',paymentTerms:ptA,notes:quoteNotes[0]||'',salesPersonOverride:quoteSalesPerson[0]||'',endUser:(endUser[0]&&(endUser[0].name||endUser[0].address))?Object.assign({},endUser[0]):null,unsecuredParts:unsecuredParts};
    if(second)order.wh2=second;

    quoteOrder[1](order);showQuote[1](true);showPartWh[1](false);
    p.toast('仮押さえ＆見積作成完了（部材別倉庫: '+((WH_MAP[main]||{}).s||main)+(second?' + '+((WH_MAP[second]||{}).s||second):'')+'）: '+no+(unsecuredParts.length?'（未確保'+unsecuredParts.length+'件）':''));
    broadcastOrderUpdate(p.userName||'',no+' 仮押さえ作成（部材別倉庫）');

  }

    var pt3=paymentTerms[0]==='その他'?paymentCustom[0]:paymentTerms[0];

    var existing=quoteOrder[0];

    var order={no:no,cid:cust.id,wh:wh,status:'見積作成',date:isUpdate?existing.date:td2(),lines:lines[0].slice(),shipping:shippingByMethod(lines[0],wh,shipCust(),shipInfo?shipInfo.shipping:0,shipMethod[0]),discount:parseInt(discount[0])||0,createdBy:p.userName||'',shipMethod:shipMethod[0]||'',shipDest:shipDest[0]||'cust',subject:quoteSubject[0]||'',paymentTerms:pt3,notes:quoteNotes[0]||'',salesPersonOverride:quoteSalesPerson[0]||'',endUser:(endUser[0]&&(endUser[0].name||endUser[0].address))?Object.assign({},endUser[0]):null};
    if(isUpdate){
      /* v18.34 ⑪バグ修正: 見積書作成画面(モーダル)で直接編集した値を再作成で消さない。
         既存値優先は「左ペインに入力UIが無い項目」に限定する。
         v18.37 修正箇所2②: 全体備考(notes)・LEC担当者(salesPersonOverride)も見積オプションからUI削除したため対象に追加。
         あわせて直接編集のみで持つ項目（納期・受渡地・有効期限・行備考・レンタル記載）も引き継ぐ */
      order.subject=existing.subject||order.subject;
      order.discount=(existing.discount!=null&&existing.discount!==0)?existing.discount:order.discount;
      order.paymentTerms=existing.paymentTerms||order.paymentTerms;
      order.notes=existing.notes||order.notes;
      order.salesPersonOverride=existing.salesPersonOverride||order.salesPersonOverride;
      order.deliveryTerm=existing.deliveryTerm||'';
      order.deliveryPlace=existing.deliveryPlace||'';
      order.validUntil=existing.validUntil||'';
      order.rowRemarks=existing.rowRemarks||{};
      order.rentalOffset=!!existing.rentalOffset;
      order.createdBy=existing.createdBy||order.createdBy;/* v18.38 修正箇所3②: 起票者は初回作成者を維持 */

    if(isUpdate){

    quoteOrder[1](order);showQuote[1](true);
    p.bump();saveAll();
    /* v18.39 バグ修正: 「見積書のみ作成」は saveAll(localStorage)だけで、クラウド保存も他端末通知も
       行っていなかったため、作成した見積が別アカウントの案件管理に現れず、再ログインで消えていた。

    broadcastOrderUpdate(p.userName||'',no+(isUpdate?' 見積更新':' 見積作成'));

      var pRmk3=ln.isFreeInput?(ln.remark||''):'';
      rows.push({no:rowNo++,rkey:'L'+ln.id,code:'',name:pName3,qty:ln.qty,unit:pUnit3,price:ln.unitPrice||0,amount:amt,tax:amt>0?'10%(外)':'',remark:rowRemark(o,'L'+ln.id,pRmk3)});
      return;

    var colorName=(ln.type==='open'||!co)?'':co.l;var isPersonal=ln.type==='personal';

    var colorDesc2=colorName?(isUndColor(ln.color)?'（扉色未定）':' '+colorName+'色'):'';/* v18.31: und単色は「扉色未定色」の二重表記を避ける */

      colorDesc2=' '+ln.colorBreakdown.map(function(cb){if(cb.color==='open')return 'オープン×'+cb.qty;var cn=(LINE_COLORS[ln.line]||[]).find(function(cc){return cc.v===cb.color;});return (cn?cn.l:'')+'×'+cb.qty;}).join('/');
    }

    var lockObj2=LOCK_TYPES.find(function(lt){return lt.v===ln.lock;});
    if(lockObj2&&ln.lock!=='none')itemName+='　'+(lockObj2.s||lockObj2.l);
    if(isPersonal&&(!lockObj2||ln.lock==='none'))itemName+='・トッテ';
    var sq=parseInt(ln.shelfQty)||0;
    if(sq>0){var sc2=SHELF_COLORS.find(function(x){return x.v===ln.shelfColor;})||{l:'グレー'};itemName+='・棚板（'+sc2.l+'）';}

    rows.push({no:rowNo++,rkey:'L'+ln.id,code:sz.code,name:itemName,qty:ln.qty,unit:'台',price:sz.p,amount:amt2,tax:'10%(外)',configNote:'【'+lineSpecLabel(ln,'')+'】'+(sq>0?' 棚板'+sq+'枚含':''),remark:rowRemark(o,'L'+ln.id,'')});
  });
  var baseLines=o.lines.filter(function(l){return !l.isPartOnly&&l.hasBase!==false;});
  /* v14.3: ベースはパーソナルでn(1台×1枚)、常設はislands。上下共通ボードはtop側でn*2化 */
  var ti=baseLines.reduce(function(s,l){return s+lineBaseCount(l);},0);/* v18.32 要望①: ベース枚数はlineBaseCountで一元解決（directパーソナルのベース個別指定に追従。calcBOMのベース行と常に一致） */

  function rollbackStatus(order,target){
    if(p.isReadOnly){p.toast('読み取り専用モード中はステータス変更できません');return;}
    var SF=STATUS_FLOW,fi=SF.indexOf(order.status),ti=SF.indexOf(target);

    var msg;

      msg='【差し戻し】'+order.no+' を「'+order.status+'」→「'+target+'」に戻します。\n\n⚠️ 出荷済みの在庫を倉庫に戻します（在庫数が復元されます）。'+(ti>=1?'\n復元した在庫はこの案件で再度引当（仮押さえ）されます。':'\n引当も解除され、在庫は空きに戻ります。')+'\n\n本当に差し戻しますか？';
    }else if((fi===1||fi===2)&&ti<1){

/* Compute per-part quantities for an order (for held/shipped grids) */
/* v18.44 修正３③: filterLine(製品ライン)指定時は、そのラインの明細の部材だけを集計する。
   同一案件内でVer.1(扉のみ等)とVer.2の明細が混在する場合、仮押さえ一覧でバージョンを
   切り替えた際に該当バージョンの部材だけが表示されるようにする（例: RS-2026-093）。
   ただし鍵類等の共通在庫キー(COMMON_STOCK_KEYS)は在庫表と同じく全ライン共通プールのため
   絞り込まず常に集計する（絞ると在庫表の仮押さえ数と一覧の数が食い違うため）。
   filterLine省略時は従来どおり全明細を集計（Excel出力等の既存呼び出しは無影響）。 */
function computeOrderParts(order,filterLine){
  var parts={};
  var lineOk=function(ln,key,isDoor){
    if(!filterLine)return true;
    if(!isDoor&&isCommonStockKey(key))return true;
    return ln.line===filterLine;
  };
  order.lines.forEach(function(ln){
    if(ln.isFreeInput)return;
    if(ln._returned)return;/* v14.5 C12: 返品済みラインは部材集計に含めない（納品/確定Excelの過大計上を防ぐ） */
    if(ln.isPartOnly){
      if(!lineOk(ln,ln.partKey,ln.isDoor))return;
      var pk;
      if(ln.isDoor){pk=ln.partKey+':'+ln.color+':'+ln.partSub;}
      else if(ln.partSub!==undefined){pk=ln.partKey+':'+ln.partSub;}
      else{pk=ln.partKey;}
      parts[pk]=(parts[pk]||0)+ln.qty;
      return;
    }
    var bom=calcBOM(ln.size,ln.islands,ln.tiers,ln.lock,ln.type,ln);
    bom.forEach(function(b){
      if(!lineOk(ln,b.key,b.isDoor))return;/* v18.44 修正３③: ライン絞り込み（共通在庫キーは常に通す） */
      if(b.isDoor){
        var colors2=ln.colorBreakdown&&ln.colorBreakdown.length>0?ln.colorBreakdown:[{color:ln.color,qty:b.qty}];
        colors2.forEach(function(dc){
          var pk=b.key+':'+dc.color+':'+b.doorSub;
          parts[pk]=(parts[pk]||0)+dc.qty;
        });
      }else if(b.sub!==undefined){
        var pk=b.key+':'+b.sub;
        parts[pk]=(parts[pk]||0)+b.qty;
      }else{
        parts[b.key]=(parts[b.key]||0)+b.qty;
      }
    });
  });
  /* v14.2 Codex P2対応: 部分解放を差し引く（押さえ数の正確な現値を返す） */
  if(order._partialReleases&&order._partialReleases.length){
    order._partialReleases.forEach(function(r){
      /* v18.44 修正３③: ライン絞り込み中は、他ライン明細の部分解放を差し引かない（rにライン記録が無い旧データは従来どおり差し引く） */
      if(filterLine&&r.line&&!(!r.isDoor&&isCommonStockKey(r.key))&&r.line!==filterLine)return;
      var pk;
      if(r.isDoor)pk=r.key+':'+(r.color||'')+':'+(r.doorSub||'');
      else if(r.sub)pk=r.key+':'+r.sub;
      else pk=r.key;
      parts[pk]=Math.max(0,(parts[pk]||0)-r.released);
    });
  }
  return parts;
}
/* v18.46 修正５⑦: 押さえ台帳(_actualHeld)から「この倉庫で押さえている分」だけを集計する。
   2倉庫で押さえた案件を倉庫ごとの列に分けて表示するために使う。
   台帳(_actualHeld)を持たない旧形式の明細は倉庫別に分解できないため、その明細の押さえ先倉庫
   (_heldWh、無ければ案件の主倉庫)側にまとめて計上する。 */
function computeOrderPartsByWh(order,filterLine,wh){
  var parts={};
  var lineOk=function(ln,key,isDoor){
    if(!filterLine)return true;
    if(!isDoor&&isCommonStockKey(key))return true;
    return ln.line===filterLine;
  };
  (order.lines||[]).forEach(function(ln){
    if(ln.isFreeInput||ln._returned)return;
    var ah=ln._actualHeld;
    if(ah&&ah.length){
      ah.forEach(function(e){
        if((e._wh||ln._heldWh||order.wh)!==wh)return;
        if(!lineOk(ln,e.key,e.isDoor))return;
        var pk=e.isDoor?(e.key+':'+(e.color||'')+':'+(e.size||''))
              :((e.sub!==undefined&&e.sub!==null)?(e.key+':'+e.sub):e.key);
        parts[pk]=(parts[pk]||0)+(parseInt(e.qty)||0);
      });
    }else if((ln._heldWh||order.wh)===wh){
      var sub=computeOrderParts({lines:[ln]},filterLine);
      Object.keys(sub).forEach(function(k){parts[k]=(parts[k]||0)+sub[k];});
    }
  });
  return parts;
}
/* Get part key for a uniRow to look up in computeOrderParts result */
function uniRowPartKey(r){
  if(r.isDoor)return r.dk+':'+r.color+':'+r.doorSub;
  if(r.sub!==undefined)return r.key+':'+r.sub;
  return r.key;
}

                }
                newItemForm[1]({key:'',label:'',irisu:0});
                p.toast('部材を追加しました: '+f.label);
                bump[1](bump[0]+1);

        ),
        h('div',{style:{maxHeight:'55vh',overflow:'auto'}},
          h('table',{className:'tbl',style:{fontSize:11}},
            h('thead',null,h('tr',null,
              h('th',{style:{minWidth:200}},'部材名'),
              h('th',{style:{minWidth:140}},'キー'),
              h('th',{style:{minWidth:80,textAlign:'right'}},'入数'),
              h('th',{style:{minWidth:80,textAlign:'center'}},'種別'),
              h('th',{style:{minWidth:80,textAlign:'center'}},'操作')
            )),
            h('tbody',null,(function(){

              structRowsAll.forEach(function(row){
                var iri=row.sub!==undefined?(IRISU[row.key]&&typeof IRISU[row.key]==='object'?IRISU[row.key][row.sub]:''):(typeof IRISU[row.key]==='number'?IRISU[row.key]:'');
                rows.push({label:row.label,key:row.key+(row.sub?'|'+row.sub:''),baseKey:row.key,sub:row.sub,irisu:iri,custom:!!row.isCustom});
              });
              return rows.map(function(r,i){

                  h('td',{style:{fontWeight:600}},r.label,r.custom?h('span',{style:{marginLeft:4,fontSize:8,padding:'1px 4px',background:'#FCD34D',color:'#7C2D12',borderRadius:3}},'カスタム'):null),
                  h('td',{style:{fontSize:9,color:'var(--g500)'}},r.key),
                  h('td',{style:{textAlign:'right'}},
                    h('input',{className:'inp',type:'number',min:0,value:r.irisu||0,onChange:function(e){
                      if(p.isReadOnly){p.toast('読み取り専用モード中は編集できません');return;}
                      var v=parseInt(e.target.value)||0;
                      try{
                        var ci=JSON.parse(localStorage.getItem('lec_custom_irisu')||'{}');
                        if(r.sub){
                          if(typeof IRISU[r.baseKey]!=='object'||IRISU[r.baseKey]===null)IRISU[r.baseKey]={};
                          IRISU[r.baseKey][r.sub]=v;
                          if(typeof ci[r.baseKey]!=='object'||ci[r.baseKey]===null)ci[r.baseKey]={};
                          ci[r.baseKey][r.sub]=v;
                        }else{
                          IRISU[r.baseKey]=v;
                          ci[r.baseKey]=v;
                        }
                        localStorage.setItem('lec_custom_irisu',JSON.stringify(ci));
                        bump[1](bump[0]+1);
                        cloudSave(p.userName);/* v14.6: 入数変更を全端末へ共有 */
                      }catch(ex){p.toast('入数保存失敗: '+ex.message);}
                    },style:{width:80,textAlign:'right'}})
                  ),
                  h('td',{style:{textAlign:'center',fontSize:9,color:r.custom?'#7C2D12':'var(--g500)'}},r.custom?'カスタム':'標準'),
                  h('td',{style:{textAlign:'center'}},
                    r.custom?h('button',{className:'btn btn-xs btn-rd',onClick:function(){
                      if(p.isReadOnly){p.toast('読み取り専用モード中は編集できません');return;}
                      if(!confirm('部材「'+r.label+'」を削除します。\n在庫データはそのまま残ります。\nよろしいですか？'))return;
                      try{
                        var cp=JSON.parse(localStorage.getItem('lec_custom_parts')||'[]');

                    }},'🗑'):h('span',{style:{fontSize:9,color:'var(--g300)'}},'-')
                  )
                );

    /* v14.2: 日付指定スナップショットExcel出力モーダル（指定日時点の在庫数を逆算） */
    showSnapshotExcel[0]?h(Modal,{show:true,title:'📆 日付指定スナップショットExcel（在庫表 / 在庫資産）',w:580,onClose:function(){showSnapshotExcel[1](false);},
      footer:h('div',{style:{display:'flex',gap:6,justifyContent:'flex-end'}},
        h('button',{className:'btn btn-ol',onClick:function(){showSnapshotExcel[1](false);}},'キャンセル'),
        h('button',{className:'btn btn-gn',onClick:function(){
          var sf=snapshotForm[0];
          if(!sf.date){p.toast('日付を入力してください');return;}
          /* v14.2: 当日選択時に「未来扱い」されないよう、日付比較は日次正規化（時刻成分を切り捨て） */
          var targetD=new Date(sf.date+'T23:59:59');
          var nowD=new Date();
          var todayMidnight=new Date(nowD.getFullYear(),nowD.getMonth(),nowD.getDate(),23,59,59,999);
          if(targetD.getTime()>todayMidnight.getTime()){p.toast('未来日付は指定できません');return;}
          /* v14.3 Codex P2対応: 在庫基準日(STK_SNAPSHOT_DATE)より前の日付は再構築不可（基準日より前のEDIT_LOGデータがないため架空値になる） */
          var baselineD=new Date(STK_SNAPSHOT_DATE+'T00:00:00');
          if(targetD.getTime()<baselineD.getTime()){p.toast('基準日('+STK_SNAPSHOT_DATE+')より前は遡及できません。EDIT_LOG履歴がないため正確な復元は不可能です。');return;}
          try{
            /* JP形式タイムスタンプを安全にパース */
            var parseTs=function(ts){
              if(!ts)return null;
              var m=ts.match(/^(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)$/);
              if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
              var d=new Date(ts);return isNaN(d)?null:d;
            };
            /* targetD 以降の EDIT_LOG エントリを逆方向に適用して、その日時点の在庫を再構築 */
            var historicalSTK=JSON.parse(JSON.stringify(STK));/* 現在の在庫からスタート */
            var reverseLogs=EDIT_LOG.filter(function(e){
              var d=parseTs(e.timestamp);return d&&d>targetD;
            }).slice().reverse();
            reverseLogs.forEach(function(e){
              if(!e.lineId||!e.wh||!e.key)return;
              if(!historicalSTK[e.lineId]||!historicalSTK[e.lineId][e.wh])return;
              var oldN=parseInt(e.oldVal),newN=parseInt(e.newVal);
              var diff;
              if(!isNaN(oldN)&&!isNaN(newN))diff=newN-oldN;
              else if(typeof e.newVal==='string'&&e.newVal.charAt(0)==='+')diff=parseInt(e.newVal.slice(1))||0;
              else if(typeof e.newVal==='string'&&e.newVal.charAt(0)==='-')diff=-(parseInt(e.newVal.slice(1))||0);
              else diff=(newN||0)-(oldN||0);
              /* 逆方向: targetD 以降の差分を巻き戻し */
              if(e.color){
                if(!historicalSTK[e.lineId][e.wh][e.key])historicalSTK[e.lineId][e.wh][e.key]={};
                if(!historicalSTK[e.lineId][e.wh][e.key][e.color])historicalSTK[e.lineId][e.wh][e.key][e.color]={};
                historicalSTK[e.lineId][e.wh][e.key][e.color][e.sub]=Math.max(0,(historicalSTK[e.lineId][e.wh][e.key][e.color][e.sub]||0)-diff);
              }else if(e.sub){
                if(!historicalSTK[e.lineId][e.wh][e.key])historicalSTK[e.lineId][e.wh][e.key]={};
                historicalSTK[e.lineId][e.wh][e.key][e.sub]=Math.max(0,(historicalSTK[e.lineId][e.wh][e.key][e.sub]||0)-diff);
              }else{
                historicalSTK[e.lineId][e.wh][e.key]=Math.max(0,(historicalSTK[e.lineId][e.wh][e.key]||0)-diff);
              }
            });
            /* 当時の在庫を取得する関数 - 鍵類(COMMON_STOCK_KEYS)は全ラインを合算（gs()と同等の挙動） */
            var hgs=function(line,wh,key,sub){
              if(isCommonStockKey(key)){
                var total=0;
                LINES.forEach(function(ln){
                  var s=historicalSTK[ln.id]&&historicalSTK[ln.id][wh];if(!s)return;
                  if(sub!==undefined){var o=s[key];total+=(o&&o[sub])||0;}
                  else{total+=parseInt(s[key])||0;}
                });
                return total;
              }
              var s=historicalSTK[line]&&historicalSTK[line][wh];if(!s)return 0;
              if(sub!==undefined){var o=s[key];return(o&&o[sub])||0;}
              return s[key]||0;
            };
            var hgd=function(line,wh,color,size,dk){
              var s=historicalSTK[line]&&historicalSTK[line][wh]&&historicalSTK[line][wh][dk||'door'];
              return(s&&s[color]&&s[color][size])||0;
            };
            var wb=XLSX.utils.book_new();
            /* v14.2 Codex P3対応: カスタム部材は structRowsAll に既にマージされているため、ここでの再追加は廃止 */
            if(sf.type==='stock'){
              /* 在庫表スナップショット - 全ライン */
              LINES.forEach(function(lnObj){
                var lWhs=WH_IDS.filter(function(w){return hasStock(lnObj.id,w);});
                if(!lWhs.length)return;
                var data=[['【'+lnObj.name+' 在庫表】 基準日: '+sf.date],[],['部材','サイズ/色'].concat(lWhs.map(function(w){return WH_MAP[w].s;})).concat(['合計'])];
                structRowsAll.forEach(function(row){
                  if(isCommonStockKey(row.key)&&lnObj.id!=='jp2')return;
                  var stks=lWhs.map(function(w){return row.sub!==undefined?hgs(lnObj.id,w,row.key,row.sub):hgs(lnObj.id,w,row.key);});
                  var tot=stks.reduce(function(a,b){return a+b;},0);
                  if(tot>0)data.push([row.label,row.sub||''].concat(stks).concat([tot]));
                });
                /* 扉も追加 */
                var dColors=(LINE_COLORS[lnObj.id]||[]).filter(function(c){return !c.und;});
                var dSizes=LINE_SIZES[lnObj.id]||[];
                ['door','doorH'].forEach(function(dk){
                  dColors.forEach(function(c){
                    dSizes.forEach(function(sz3){
                      if(!isDoorSize(sz3))return;/* v18.48 修正６①: SSα扉も集計に含める */
                      var stks=lWhs.map(function(w){return hgd(lnObj.id,w,c.v,sz3,dk);});
                      var tot=stks.reduce(function(a,b){return a+b;},0);
                      if(tot>0)data.push([(dk==='doorH'?'扉〈ホタ〉':'扉')+' '+c.l,sz3].concat(stks).concat([tot]));
                    });
                  });
                });
                XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),lnObj.name);
              });
              XLSX.writeFile(wb,'在庫表スナップショット_'+sf.date+'.xlsx');
              p.toast('在庫表スナップショット出力完了: '+sf.date+'時点 ('+reverseLogs.length+'件遡及)');
            }else if(sf.type==='asset'){
              /* 在庫資産スナップショット */
              var grand=0;
              var sumData=[['【在庫資産スナップショット】 基準日: '+sf.date],[],['製品ライン','合計金額']];
              LINES.forEach(function(lnObj){
                var lWhs=WH_IDS.filter(function(w){return hasStock(lnObj.id,w);});
                var data=[['【'+lnObj.name+' 在庫資産】 基準日: '+sf.date],[],['部材','数量','単価','金額']];
                var lineTotal=0;
                structRowsAll.forEach(function(row){
                  if(isCommonStockKey(row.key)&&lnObj.id!=='jp2')return;
                  var tq=0;lWhs.forEach(function(w){tq+=row.sub!==undefined?hgs(lnObj.id,w,row.key,row.sub):hgs(lnObj.id,w,row.key);});
                  var cost=row.sub!==undefined?(UNIT_COST[row.key]&&UNIT_COST[row.key][row.sub]||0):(typeof UNIT_COST[row.key]==='number'?UNIT_COST[row.key]:0);
                  var val=tq*cost;lineTotal+=val;
                  if(tq>0)data.push([row.label,tq,cost,val]);
                });
                /* v14.2 Codex P3対応: カスタム部材は structRowsAll に既にマージ済みのため再追加しない */
                /* 扉資産 */
                var dColors=(LINE_COLORS[lnObj.id]||[]).filter(function(c){return !c.und;});
                var dSizes=LINE_SIZES[lnObj.id]||[];
                ['door','doorH'].forEach(function(dk){
                  dColors.forEach(function(c){
                    dSizes.forEach(function(sz3){
                      if(!isDoorSize(sz3))return;/* v18.48 修正６①: SSα扉も集計に含める */
                      var tq=0;lWhs.forEach(function(w){tq+=hgd(lnObj.id,w,c.v,sz3,dk);});
                      if(tq>0){
                        var cost=(UNIT_COST[dk]&&UNIT_COST[dk][sz3])||0;
                        var val=tq*cost;lineTotal+=val;
                        data.push([(dk==='doorH'?'扉ホタ':'扉')+' '+c.l+' '+sz3,tq,cost,val]);
                      }
                    });
                  });
                });
                data.push([],['合計','','',lineTotal]);
                XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),lnObj.name);
                sumData.push([lnObj.name,lineTotal]);
                grand+=lineTotal;
              });
              sumData.push(['総合計',grand]);
              XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sumData),'サマリー');
              XLSX.writeFile(wb,'在庫資産スナップショット_'+sf.date+'.xlsx');
              p.toast('在庫資産スナップショット出力完了: '+sf.date+'時点 (¥'+fm(grand)+')');
            }
            showSnapshotExcel[1](false);
          }catch(ex){p.toast('Excel出力に失敗: '+ex.message);}
        }},'📥 Excel出力')
      )},
      h('div',null,
        h('p',{style:{fontSize:11,color:'var(--g500)',marginBottom:10,lineHeight:1.7}},
          '指定した日付時点での在庫データ（在庫表または在庫資産）をパーツごとに出力します。',
          h('br'),
          h('b',null,'計算方法: '),'現在のSTKから、指定日以降のEDIT_LOG差分を逆方向に巻き戻して再構築します。',
          h('br'),
          h('b',{style:{color:'#DC2626'}},'※注意: '),'EDIT_LOG に記録された変更のみが反映されます。記録外の変更（直接的なSTK改変等）は再現できません。'
        ),
        h('div',{style:{display:'flex',gap:8,marginBottom:10}},
          h('div',{style:{flex:1}},
            h('label',{style:{fontSize:10,fontWeight:600,color:'var(--g500)'}},'基準日（この日時点の在庫を出力）'),
            h('input',{className:'inp',type:'date',value:snapshotForm[0].date,onChange:function(e){var f=Object.assign({},snapshotForm[0]);f.date=e.target.value;snapshotForm[1](f);}})
          ),
          h('div',{style:{flex:1}},
            h('label',{style:{fontSize:10,fontWeight:600,color:'var(--g500)'}},'出力種別'),
            h('select',{className:'inp',value:snapshotForm[0].type,onChange:function(e){var f=Object.assign({},snapshotForm[0]);f.type=e.target.value;snapshotForm[1](f);}},
              h('option',{value:'stock'},'在庫表（パーツ別数量）'),
              h('option',{value:'asset'},'在庫資産（パーツ別金額）')
            )
          )
        ),
        h('div',{style:{display:'flex',gap:4,marginBottom:10}},
          [{l:'今日',d:0},{l:'1週間前',d:7},{l:'1ヶ月前',d:30},{l:'3ヶ月前',d:90},{l:'半年前',d:180}].map(function(pr){
            return h('button',{key:pr.l,className:'btn btn-xs btn-ol',onClick:function(){
              var tdy=new Date();var prev=new Date(tdy.getTime()-pr.d*86400000);
              var fmt=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
              var f=Object.assign({},snapshotForm[0]);f.date=fmt(prev);snapshotForm[1](f);
            }},pr.l);
          })
        )
      )
    ):null
  );
}
